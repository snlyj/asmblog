name: CI & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNU binutils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils

      - name: Assemble stripped static x86-64 binary
        run: |
          bash build.sh --strip
          ls -lh asmblog
          file asmblog
          readelf -d asmblog | (! grep -q NEEDED)

      - name: Run full automated test suite
        run: python3 tests/test_all.py

      - name: Package release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp asmblog release/asmblog-linux-x86_64
          (cd release && sha256sum asmblog-linux-x86_64 > SHA256SUMS.txt)
          ls -lh release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/asmblog-linux-x86_64
            release/SHA256SUMS.txt
          generate_release_notes: true
