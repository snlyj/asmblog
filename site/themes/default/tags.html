<section class="page-head">
  <h1>标签云</h1>
  <p class="muted">共 {{ tag_count }} 个主题标签</p>
</section>

<div class="tag-cloud">
  {{#tags}}
  <a class="tag-pill" href="/tag/{{ name }}/">
    <span>#{{ name }}</span>
    <span class="tag-count">{{ count }}</span>
  </a>
  {{/tags}}
  {{^tags}}
  <p class="empty-state">暂无标签。</p>
  {{/tags}}
</div>
