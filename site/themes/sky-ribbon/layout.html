<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page_title }} &middot; {{ site_name }}</title>
  <meta name="description" content="{{ og_desc }}">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ og_desc }}">
  <meta property="og:url" content="{{ og_url }}">
  {{#og_image}}<meta property="og:image" content="{{ og_image }}">{{/og_image}}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og_title }}">
  <meta name="twitter:description" content="{{ og_desc }}">
  {{#og_image}}<meta name="twitter:image" content="{{ og_image }}">{{/og_image}}
  <link rel="icon" type="image/svg+xml" href="/static/favicon-ribbon.svg?v=2">
  <link rel="alternate" type="application/rss+xml" title="{{ site_name }} RSS" href="/rss.xml">
  <link rel="stylesheet" href="/static/sky-ribbon.css?v=13">
  <script>
    (function(){
      var d = document.documentElement, t = null, fx = null;
      try { t = localStorage.getItem('asmblog-theme'); fx = localStorage.getItem('asmblog-fx'); } catch (_) {}
      if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
      d.setAttribute('data-theme', t || 'light');
      if (fx === 'off') d.setAttribute('data-fx', 'off');
    })();
  </script>
</head>
<body>
  {{> header }}

  <div id="pjax-stage" class="pjax-stage">
    <main class="page-shell main-content">
      {{{ body }}}
    </main>
  </div>

  {{> footer }}
  <script src="/static/sky-ribbon.js?v=13" defer></script>
</body>
</html>
