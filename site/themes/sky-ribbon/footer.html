{{#footer_text}}
<footer class="site-footer">
  <div class="footer-pill">
    <p class="footer-love">{{ footer_text }}</p>
  </div>
</footer>
{{/footer_text}}

<button id="back-top" class="back-top" type="button" title="回到顶部" aria-label="回到顶部">
  <svg class="back-top-ring" viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">
    <circle class="ring-track" cx="22" cy="22" r="19"/>
    <circle id="ring-progress" class="ring-fill" cx="22" cy="22" r="19"/>
  </svg>
  <span class="back-top-icon" aria-hidden="true">↑</span>
</button>
