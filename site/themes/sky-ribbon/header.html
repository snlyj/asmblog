          <path d="M18 5 L20.8 13.2 L29 16 L20.8 18.8 L18 27 L15.2 18.8 L7 16 L15.2 13.2 Z" fill="url(#rb)"/>
          <path d="M13 24 C10 27 8 30 9 32 C12 31 15 28 18 26 C21 28 24 31 27 32 C28 30 26 27 23 24" fill="none" stroke="#FF9EC7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

        <span class="switch-icon switch-sun" aria-hidden="true">☀</span>
        <span class="switch-icon switch-moon" aria-hidden="true">☾</span>
        <span class="switch-thumb" aria-hidden="true"></span>
